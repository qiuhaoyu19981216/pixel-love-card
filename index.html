<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Love Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #hearts {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:1;
        }
        .heart {
            position: absolute;
            font-size: 28px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% {transform: translateY(-50px); opacity:1;}
            100% {transform: translateY(100vh); opacity:0;}
        }
        .card {
            position: relative;
            z-index: 2;
            background: #fff;
            padding:40px 30px;
            border-radius: 20px;
            text-align:center;
            max-width: 420px;
            box-shadow: 0 0 30px #ff77aa77;
        }
        .card h2 {
            color:#222;
            margin-bottom:20px;
        }
        .card p {
            color:#444;
            margin-bottom:30px;
            font-size:18px;
        }
        .btn-group {
            display:flex;
            gap:20px;
            justify-content:center;
        }
        button {
            padding:12px 30px;
            font-size:18px;
            border:none;
            border-radius: 12px;
            cursor:pointer;
            transition:0.2s;
        }
        #yes {
            background:#ff5b8c;
            color:white;
        }
        #no {
            background:#888;
            color:white;
            position:relative;
        }
    </style>
</head>
<body>
    <div id="hearts"></div>
    <div class="card">
        <h2>要不要和我一起？</h2>
        <p>我有话想对你说❤️</p >
        <div class="btn-group">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>

<script>
//爱心飘落效果
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.textContent=["💗","💖","💘","💕"][Math.floor(Math.random()*4)];
    h.style.animationDuration=4+Math.random()*4+"s";
    document.getElementById("hearts").appendChild(h);
    setTimeout(()=>h.remove(),8000);
},260);

const yesBtn = document.querySelector("#yes");
const noBtn = document.querySelector("#no");
const receiveEmail = "qiugaokaojiayou@163.com";

// YES按钮：提交信息 + 弹窗
yesBtn.addEventListener("click",async ()=>{
  try{
    await fetch(`https://formsubmit.co/ajax/${receiveEmail}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ result:"对方点击 YES，愿意❤️" })
    });
  }catch(e){
    console.log("发送失败",e)
  }
  alert("太棒啦！❤️");
})

// NO按钮：鼠标悬浮乱跑 + 提交信息 +弹窗
noBtn.addEventListener("mouseenter",()=>{
    const w = window.innerWidth - 120;
    const h = window.innerHeight - 80;
    noBtn.style.left = Math.random()*w + "px";
    noBtn.style.top = Math.random()*h + "px";
})
noBtn.addEventListener("click",async ()=>{
  try{
    await fetch(`https://formsubmit.co/ajax/${receiveEmail}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ result:"对方点击 NO，拒绝💔" })
    });
  }catch(e){
    console.log("发送失败",e)
  }
  alert("呜呜，再考虑一下🥺");
})
</script>
</body>
</html>
